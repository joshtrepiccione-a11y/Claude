name: Deploy LD8 site to GitHub Pages

on:
  push:
    branches:
      - claude/initial-setup-SjVdw   # repo default branch
      - claude/sleepy-babbage-EwxKw  # PR preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but don't cancel in-progress runs so
# an in-flight deploy can finish before the next one starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Static site lives at repo root. The .github directory is
          # filtered out automatically by upload-pages-artifact.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

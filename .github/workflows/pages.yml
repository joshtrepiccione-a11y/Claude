name: Deploy site to GitHub Pages

# Deploys the static site (index.html, app.js, style.css, data/) to
# GitHub Pages. No build step — the artifact is the repo root with the
# default exclusions applied by upload-pages-artifact.
#
# One-time setup: in repo Settings -> Pages, set "Source" to
# "GitHub Actions" so this workflow becomes the publisher.

on:
  push:
    branches:
      - main
      - claude/election-map-atlantic-county-3t03V
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Netlify build configuration (repo root).
# The default branch + the snazzy-liger Netlify site are dedicated to the
# Bender for County Clerk app (v3-clerk) at the site root. The Sheriff app
# (v3-sheriff) deploys from its OWN Netlify site using Base directory
# "v3-sheriff" (see v3-sheriff/netlify.toml) — it does NOT change this root
# build, so this file is safe on the default branch.

[build]
  command = "cd v3-clerk && npm install && npm run build"
  publish = "v3-clerk/dist"

[build.environment]
  NODE_VERSION = "20"
